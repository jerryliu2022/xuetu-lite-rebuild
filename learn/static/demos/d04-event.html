<!DOCTYPE html>
<!--
  知识点：事件绑定、事件委托、data-* 自定义属性
  归属：前端
  源码出处：frontend/app.js:262-269  function bindVideoCards()
           frontend/app.js:86-93   querySelectorAll("[data-demo-account]") 一键登录
           frontend/app.js:253     <button class="video-card" data-video="${item.video_id}">

  为什么要用「事件委托」而不是给每个按钮都绑一次？
    假设页面有 100 张课程卡片，每张卡渲染时都 addEventListener 一次，
    而且 innerHTML 重绘之后旧节点被销毁、监听全部失效，要重新绑。
    正确做法：把 data-video 写在 HTML 属性上，只在父容器绑一次事件，
    靠 event.target.closest() 找到被点的那张卡，再从 dataset 里取值。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>事件与事件委托</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; padding: 24px; background: #f6f7fb; color: #1f2430; }
    .card-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 14px 18px; cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,0,0,.06); border: 2px solid transparent; transition: .15s; }
    .card:hover { border-color: #3b6cf6; transform: translateY(-2px); }
    .card.active { border-color: #3b6cf6; background: #eef2ff; }
    #log { margin-top: 16px; background: #1e2430; color: #d5f5e3; padding: 14px;
           border-radius: 10px; font-size: 13px; min-height: 70px; white-space: pre-wrap; }
    button { padding: 8px 14px; border: none; border-radius: 8px; background: #3b6cf6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h3>事件委托 + data-*</h3>
  <button onclick="addCard()">动态新增一张卡片</button>
  <button onclick="clearLog()">清空日志</button>

  <p style="color:#5f6672;font-size:14px">
    新增的卡片没有单独绑事件也能点 —— 因为监听器绑在父容器上。
  </p>

  <div class="card-list" id="list">
    <div class="card" data-video="V001" data-title="高等数学">高等数学 V001</div>
    <div class="card" data-video="V002" data-title="数据结构">数据结构 V002</div>
    <div class="card" data-video="V005" data-title="计算机网络">计算机网络 V005</div>
  </div>

  <div id="log">点击卡片，这里会打印被点击元素上的 data-* 值</div>

  <script>
    let counter = 3;
    const logBox = document.getElementById("log");

    function writeLog(text) {
      logBox.textContent = text + "\n" + logBox.textContent.replace("点击卡片，这里会打印被点击元素上的 data-* 值", "").trim();
    }

    // ---- 事件委托：只在父容器上绑一次 ----
    // app.js:262-269 bindVideoCards() 用的就是这一套
    document.getElementById("list").addEventListener("click", (event) => {
      // closest() 会从被点的元素往上找，直到匹配选择器为止
      const card = event.target.closest(".card");
      if (!card) return;   // 点在空白处，什么都不做

      // dataset 会自动读取 HTML 上所有 data-xxx 属性：data-video -> dataset.video
      const videoId = card.dataset.video;
      const title = card.dataset.title;

      // 高亮当前选中项
      document.querySelectorAll(".card").forEach((el) => el.classList.remove("active"));
      card.classList.add("active");

      writeLog(`点击事件被父容器捕获
  dataset.video = ${videoId}
  dataset.title = ${title}
  真实项目里下一步就是 location.href = "/play/${videoId}"`);
    });

    function addCard() {
      counter += 1;
      const list = document.getElementById("list");
      // insertAdjacentHTML 追加新节点；注意这里没有给新节点绑任何事件
      list.insertAdjacentHTML("beforeend",
        `<div class="card" data-video="V00${counter}" data-title="新课${counter}">新课 ${counter} V00${counter}</div>`);
      writeLog(`新增了 V00${counter}，监听依然生效（事件委托的好处）`);
    }

    function clearLog() {
      logBox.textContent = "";
    }
  </script>
</body>
</html>
